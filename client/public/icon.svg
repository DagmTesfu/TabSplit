<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Background: Deep Navy (#1E3A5F) Rounded Container -->
  <rect width="512" height="512" rx="112" fill="#1E3A5F" />

  <!-- Inner Receipt Card: White Paper with Shadow -->
  <g filter="url(#shadow)">
    <rect x="124" y="96" width="264" height="320" rx="20" fill="#FFFFFF" />
    
    <!-- Receipt Header Bar -->
    <rect x="156" y="128" width="200" height="32" rx="6" fill="#1E3A5F" />

    <!-- Item Row 1 -->
    <rect x="156" y="184" width="110" height="12" rx="4" fill="#94A3B8" />
    <rect x="306" y="184" width="50" height="12" rx="4" fill="#1E3A5F" />

    <!-- Item Row 2 -->
    <rect x="156" y="214" width="130" height="12" rx="4" fill="#94A3B8" />
    <rect x="306" y="214" width="50" height="12" rx="4" fill="#1E3A5F" />

    <!-- Item Row 3 -->
    <rect x="156" y="244" width="90" height="12" rx="4" fill="#94A3B8" />
    <rect x="306" y="244" width="50" height="12" rx="4" fill="#1E3A5F" />

    <!-- Dashed Separator -->
    <line x1="156" y1="284" x2="356" y2="284" stroke="#CBD5E1" stroke-width="3" stroke-dasharray="8 6" />

    <!-- Total Row -->
    <rect x="156" y="312" width="80" height="18" rx="4" fill="#1E3A5F" />
    <rect x="290" y="312" width="66" height="18" rx="4" fill="#0F7B5F" />
  </g>

  <!-- Emerald Success Floating Badge with Checkmark -->
  <circle cx="380" cy="380" r="64" fill="#0F7B5F" filter="url(#shadow)" />
  <circle cx="380" cy="380" r="62" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-opacity="0.2" />
  <path d="M352 380 L372 400 L412 360" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
</svg>
